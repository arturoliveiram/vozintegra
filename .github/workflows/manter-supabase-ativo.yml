# O plano gratuito do Supabase pausa o banco depois de 7 dias sem uso,
# e aí o canal de denúncias para de funcionar. Esta rotina faz uma consulta
# leve a cada 2 dias para o banco continuar ativo.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: https://vbgrkpfozgitikgiklin.supabase.co
          # Chave pública (a mesma usada no index.html)
          SUPABASE_KEY: sb_publishable_lPOC3pQ13sTb8D7fcy0eGw_eOYWXzw0
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/empresa_por_codigo" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_codigo":"manter-ativo"}'
